name: Backend catalogue performance regression
on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - 'tests/**'
      - middleware/controllers/productController.js
      - tests/catalog-performance.test.js
      - tests/startup-performance.test.js
      - utils/initializeIndexes.js
      - utils/productReviews.js
      - server.js
      - .github/workflows/backend-catalogue.yml
  workflow_dispatch:
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Backend regression suite
        run: npm test
      - name: Syntax and file health
        run: node scripts/check-backend-files.cjs
      - name: Known dependency security advisories
        run: npm audit --audit-level=moderate
