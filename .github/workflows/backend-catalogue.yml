name: Backend catalogue performance regression
on:
  pull_request:
    paths:
      - middleware/controllers/productController.js
      - tests/catalog-performance.test.js
      - .github/workflows/backend-catalogue.yml
  workflow_dispatch:
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Public catalogue data/privacy regression
        run: node --test tests/catalog-performance.test.js
      - name: Syntax and file health
        run: node scripts/check-backend-files.cjs
