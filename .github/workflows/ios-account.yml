name: iPhone account integrations
on:
  pull_request:
    paths: ['models/User.js', 'middleware/authMiddleware.js', 'middleware/controllers/*AuthController.js', 'middleware/controllers/authController.js', 'middleware/controllers/accountDeletionController.js', 'utils/appleIdentity.js', 'routes/authRoutes.js', 'tests/**', '.github/workflows/ios-account.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
